name: Android CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8

    - name: build_it
      run: |
          ls -al
          id -a
          pwd
          sudo apt-get --quiet update --yes
          sudo apt-get --quiet install --yes wget unzip lib32stdc++6 lib32z1 ant ant-optional faketime git tcl libtool automake autoconf gawk libssl-dev make libqt5widgets5
          export ANDROID_BUILD_TOOLS="25.0.2"
          export NDK_VERSION="17c"
          export WGET="wget --quiet --tries=0"
          export ANDROID_HOME=$PWD/android-sdk-linux
          rm -rf $ANDROID_HOME android-sdk.tgz
          $WGET --output-document=android-sdk.tgz https://dl.google.com/android/repository/tools_r25.2.5-linux.zip
          unzip -qq -d $ANDROID_HOME android-sdk.tgz
          mkdir -p $ANDROID_HOME/licenses || true
          echo 8933bad161af4178b1185d1a37fbf41ea5269c55 > $ANDROID_HOME/licenses/android-sdk-license
          echo 79120722343a6f314e0719f863036c702b0e6b2a > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo 84831b9409646a918e30573bab4c9c91346d8abd > $ANDROID_HOME/licenses/android-sdk-preview-license-d099d938
          echo y | $ANDROID_HOME/tools/android --silent update sdk --no-ui --all --filter android-14,android-29,platform-tools,extra-android-m2repository,build-tools-${ANDROID_BUILD_TOOLS}
          export PATH=$PATH:${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/tools
          rm -rf $PWD/android-ndk*  android-ndk.zip
          $WGET --output-document=android-ndk.zip https://dl.google.com/android/repository/android-ndk-r${NDK_VERSION}-linux-x86_64.zip
          unzip -qq android-ndk.zip
          export ANDROID_NDK_HOME=$PWD/android-ndk-r${NDK_VERSION}
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -fdx
          git submodule sync --recursive
          git submodule foreach --recursive git submodule sync
          git submodule update --init --recursive
          projectroot=`pwd`
          export TZ=UTC
          TIMESTAMP=`printf "%(%Y-%m-%d %H:%M:%S)T" $(git log -n1 --format=format:%at)`
          faketime -f "$TIMESTAMP" make -C external/
          faketime -f "$TIMESTAMP" $ANDROID_NDK_HOME/ndk-build
          ./gradlew clean assemble
          find . -name "*.pom"|grep -i iocip
          pwd
          ls -al ./build/outputs/aar/
          mkdir ./artefacts/
          cp -av ./build/outputs/aar/IOCipher-release.aar ./artefacts/data-release.aar

    - name: maven_package
      run: |
          pwd
          aar_dir=./artefacts
          aar_file=$aar_dir/data-release.aar
          version="0.4.2.101"
          rm -Rf ./tmp/
          mkdir -p ./tmp/
          cp -av .m2 ./tmp/
          mv tmp/.m2/repository/info/guardianproject/iocipher/IOCipher/0.4.2 tmp/.m2/repository/info/guardianproject/iocipher/IOCipher/"$version"
          mv tmp/.m2/repository/info/guardianproject/iocipher/IOCipher/"$version"/IOCipher-0.4.2.pom tmp/.m2/repository/info/guardianproject/iocipher/IOCipher/"$version"/IOCipher-"$version".pom
          rm tmp/.m2/repository/info/guardianproject/iocipher/IOCipher/"$version"/IOCipher-0.4.2.aar
          cp -av "$aar_file" tmp/.m2/repository/info/guardianproject/iocipher/IOCipher/"$version"/IOCipher-"$version".aar
          sed -i -e 's#0.4.2#'"$version"'#g' tmp/.m2/repository/info/guardianproject/iocipher/IOCipher/maven-metadata-local.xml
          sed -i -e 's#0.4.2#'"$version"'#g' tmp/.m2/repository/info/guardianproject/iocipher/IOCipher/"$version"/IOCipher-"$version".pom
          cd tmp/
          zip -r local_maven_iocpiher_"$version".zip .m2
          echo "##########################"
          echo ""
          ls -al $(pwd)/local_maven_iocpiher_"$version".zip
          echo ""
          echo "##########################"
